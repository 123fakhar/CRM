[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Do NOT set startCommand here with single-quoted sh -c — it prevents ${PORT} expansion.
# Dockerfile CMD binds uvicorn to 0.0.0.0:${PORT}.
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
