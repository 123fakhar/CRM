# Render Blueprint — Seagulls Communications CRM
# Connect this repo in https://dashboard.render.com and apply the blueprint.

services:
  - type: web
    name: seagulls-crm
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: STATIC_DIR
        value: /app/static
      - key: DATABASE_URL
        fromDatabase:
          name: seagulls-crm-db
          property: connectionString

databases:
  - name: seagulls-crm-db
    plan: free
    databaseName: seagulls_crm
    user: seagulls
